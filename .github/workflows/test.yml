on: [push, pull_request]
name: Test
permissions:
  contents: read
jobs:
  test-go:
    name: Test Go (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
          - platform: darwin/arm64
            os: macos-latest
          - platform: windows/amd64
            os: windows-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Test
        run: |
          go test -v ./...
